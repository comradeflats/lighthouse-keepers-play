:root {
	--night: #070b1a; --night2: #0e1630; --ink: #f2efe6; --soft: #a9b3c8; --gold: #ffd66e; --rim: #3a4458; --bad: #ff7a6b;
}
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { background: var(--night); color: var(--ink); overflow: hidden; touch-action: none; }
#canvas { display: block; }
#canvas:focus { outline: none; }

#loader {
	position: fixed; inset: 0; z-index: 2;
	display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
	padding: 16px; box-sizing: border-box;
	background: radial-gradient(ellipse at 50% 30%, var(--night2), var(--night) 70%);
	font-family: "Keeper", monospace; -webkit-font-smoothing: none; font-smooth: never;
	transition: opacity .6s ease;
}
#loader.done { opacity: 0; pointer-events: none; }
#scene { width: min(576px, 92vw); aspect-ratio: 16 / 9; image-rendering: pixelated; border: 4px solid var(--rim); border-radius: 2px; background: #0a1024; }
.title { font-size: 36px; line-height: 1; letter-spacing: 0; text-shadow: 3px 3px 0 #000; margin: 0; text-align: center; }
.panel { width: min(576px, 92vw); display: flex; flex-direction: column; gap: 10px; }
.bar { display: flex; gap: 3px; height: 18px; padding: 3px; border: 3px solid var(--rim); background: #050812; }
.seg { flex: 1; background: #1a2238; }
.seg.on { background: var(--gold); box-shadow: inset 0 -4px 0 #c8862a; }
.seg.boot { background: #9fd4f0; box-shadow: inset 0 -4px 0 #4a7aa0; }
.row { display: flex; justify-content: space-between; gap: 12px; font-size: 16px; line-height: 24px; flex-wrap: wrap; }
.eta { color: var(--gold); font-size: 24px; line-height: 28px; }
.soft { color: var(--soft); }
.steps { display: flex; gap: 18px; font-size: 16px; color: var(--soft); }
.steps .now { color: var(--ink); }
.steps .past { color: #7fc48a; }
.tip { min-height: 48px; font-size: 16px; line-height: 24px; color: var(--soft); text-align: center; }
#notice { display: none; color: var(--bad); font-size: 16px; line-height: 24px; text-align: center; max-width: 560px; }
@media (max-width: 520px) { .title { font-size: 24px; } .eta { font-size: 16px; } }

		missing: 'В этом браузере нет того, что нужно игре:',
		tips: ['Удерживайте ↓, чтобы рубить, строить и чинить.', 'Каждую ночь маяк сжигает масло. Ярче огонь — больше кораблей и больше тварей.',
			'Указатели ведут на тропы: уголь в бору, кремень на пустоши, смола на солончаках.', 'У указателя ↑ отправляет двоих на промысел до рассвета.',
			'Q — ракета, E — колокол, R — зажигательное стекло, T — смоляной горшок.', 'Таблица приливов в журнале (J) показывает, когда придут волны.'],
	} : {
		title: 'Lighthouse Keepers', s1: '1 Download', s2: '2 Light the lamp', measuring: 'Measuring your connection…',
		left: (s) => 'About ' + s + ' left', starting: 'Lighting the lamp…', ready: 'Ready', cached: 'Already saved in your browser',
		sec: (n) => n + ' s', min: (n) => n + ' min', of: 'of', mbs: 'MB/s', mb: 'MB', fail: 'The game could not be loaded.',
		missing: 'This browser is missing something the game needs:',
		tips: ['Hold ↓ to chop, build and mend.', 'The lamp burns oil every night. Brighter brings more ships, and more of the things that follow them.',
			'Fingerposts lead to the paths: charcoal in the pinewood, flint on the moor, tar in the salt marsh.', 'At a fingerpost, ↑ sends two islanders to forage until dawn.',
			'Q flare, E hand bell, R burning glass, T tar fire-pot.', 'The tide table in the journal (J) shows when the waves will come.'],
	};
	const $ = (id) => document.getElementById(id);
	$('t-title').textContent = T.title; $('s1').textContent = T.s1; $('s2').textContent = T.s2; $('eta').textContent = T.measuring;
	document.documentElement.lang = RU ? 'ru' : 'en';

	// ---- the progress bar: 24 segments, the last few for starting up
	const SEGS = 24, BOOT_SEGS = 3;
	const bar = $('bar');
	for (let i = 0; i < SEGS; i++) { const d = document.createElement('div'); d.className = 'seg'; bar.appendChild(d); }
	function paint(frac, booting) {
		const on = Math.round(frac * SEGS);
		[...bar.children].forEach((d, i) => { d.className = 'seg' + (i < on ? (i >= SEGS - BOOT_SEGS && booting ? ' boot' : ' on') : ''); });
	}

	// ---- how long starting up takes on this machine: remembered from the last visit, or a sensible guess
	const MOBILE = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
	let bootGuess = MOBILE ? 7000 : 3500;
	try { const b = parseFloat(localStorage.getItem('lk_boot_ms')); if (b > 300 && b < 60000) bootGuess = b; } catch (e) {}

	function fmt(ms) {
		const s = Math.max(1, Math.ceil(ms / 1000));
		return s < 60 ? T.sec(s) : T.min(Math.ceil(s / 60));
	}

	// ---- download speed, smoothed, so the time left doesn't jump about
	const t0 = performance.now();
	let lastT = t0, lastB = 0, rate = 0, shownEta = Infinity, downloadDone = 0, total = 0;
	function onProgress(cur, tot) {
		const now = performance.now();
		if (tot > 0) total = tot;
		if (total <= 0) return;
		const dt = (now - lastT) / 1000;
		if (dt >= 0.25) {
			const inst = (cur - lastB) / dt;
			rate = rate ? rate * 0.7 + inst * 0.3 : inst;
			lastT = now; lastB = cur;
		}
		const frac = cur / total;
		const dlFrac = (SEGS - BOOT_SEGS) / SEGS;
		paint(frac * dlFrac, false);
		$('pct').textContent = Math.floor(frac * 100) + '%';
		$('bytes').textContent = (cur / 1e6).toFixed(1) + ' ' + T.of + ' ' + (total / 1e6).toFixed(1) + ' ' + T.mb;
		if (rate > 0) $('rate').textContent = (rate / 1e6).toFixed(1) + ' ' + T.mbs;
		if (cur >= total) { if (!downloadDone) startBoot(now); return; }
		if (now - t0 < 600 || rate <= 0) {
			// too early to tell; a fast finish means the browser had it cached
			return;
		}
		const eta = (total - cur) / rate * 1000 + bootGuess;
		// fall straight away, rise only slowly: a waiting player trusts a number that keeps going down
		shownEta = eta < shownEta ? eta : shownEta + (eta - shownEta) * 0.1;
		$('eta').textContent = T.left(fmt(shownEta));
		scene.progress = frac * dlFrac;
	}

	let bootStart = 0, bootTimer = 0;
	function startBoot(now) {
		downloadDone = now; bootStart = now;
		$('s1').className = 'past'; $('s2').className = 'now';
		if (now - t0 < 800) $('rate').textContent = T.cached;
		bootTimer = setInterval(() => {
			const el = performance.now() - bootStart;
			const f = Math.min(0.97, el / bootGuess);
			const dlFrac = (SEGS - BOOT_SEGS) / SEGS;
			paint(dlFrac + f * (1 - dlFrac), true);
			scene.progress = dlFrac + f * (1 - dlFrac);
			const left = bootGuess - el;
			$('eta').textContent = left > 900 ? T.starting + ' ' + T.left(fmt(left)).toLowerCase() : T.starting;
			$('pct').textContent = '100%';
		}, 100);
	}

	function finish() {
		const now = performance.now();
		if (!downloadDone) startBoot(now);
		clearInterval(bootTimer); clearInterval(tipTimer);
		try { localStorage.setItem('lk_boot_ms', String(Math.round(now - bootStart))); } catch (e) {}
		paint(1, true); scene.progress = 1;
		$('eta').textContent = T.ready;
		$('s2').className = 'past';
		setTimeout(() => { $('loader').classList.add('done'); scene.stop = true; }, 250);
		setTimeout(() => { $('loader').remove(); }, 1000);
	}

	function fail(err) {
		console.error(err);
		clearInterval(bootTimer);
		const n = $('notice');
		n.style.display = 'block';
		n.textContent = T.fail + ' ' + (err instanceof Error ? err.message : String(err || ''));
		$('eta').textContent = '';
	}

	// ---- tips while you wait
	let tipTimer = 0;
	let tipI = Math.floor(Math.random() * T.tips.length);
	function nextTip() { $('tip').textContent = T.tips[tipI++ % T.tips.length]; }
	nextTip(); tipTimer = setInterval(nextTip, 5000);

	// ---- the little scene: the lighthouse lamp brightens and its beam lengthens as the game loads
	const cv = $('scene'), cx = cv.getContext('2d');
	const scene = { progress: 0, stop: false, t: 0 };
	const stars = Array.from({ length: 40 }, (_, i) => [(i * 47) % 192, (i * 29) % 52, i % 3]);
	function px(x, y, w, h, c) { cx.fillStyle = c; cx.fillRect(x | 0, y | 0, w | 0, h | 0); }
	function draw() {
		if (scene.stop) return;
		scene.t += 1 / 60;
		const t = scene.t, p = scene.progress;
		const sky = ['#0a1024', '#0e1630', '#141c3c', '#1a2448', '#222c54'];
		sky.forEach((c, i) => px(0, i * 12, 192, 12, c));
		for (const [x, y, k] of stars) if ((Math.floor(t * 2) + x) % 7 !== k) px(x, y, 1, 1, k ? '#8a96c0' : '#e8ecff');
		for (let y = 0; y < 9; y++) for (let x = 0; x < 9; x++) {                         // a crescent moon
			const d1 = (x - 4) ** 2 + (y - 4) ** 2, d2 = (x - 6) ** 2 + (y - 3) ** 2;
			if (d1 <= 16 && d2 > 12) px(150 + x, 10 + y, 1, 1, '#e8ecff');
		}
		for (let y = 60; y < 108; y += 2) px(0, y, 192, 2, y % 4 ? '#0f2a40' : '#12304a'); // the sea
		for (let i = 0; i < 12; i++) { const x = (i * 23 + t * 6) % 200 - 4; px(x, 64 + (i % 5) * 9, 6, 1, '#2a5a78'); }
		// the island and the far islands
		px(0, 56, 70, 4, '#1a2a3a'); px(160, 57, 32, 3, '#1a2a3a');
		for (let x = 20; x < 120; x++) { const h = Math.round(12 * Math.sin((x - 20) / 100 * Math.PI)); px(x, 74 - h, 1, h + 34, '#1f3324'); }
		// the lighthouse: red and white bands, the lamp glowing brighter as it loads
		const lx = 66, top = 30;
		for (let y = top; y < 64; y++) { const w = 8 - Math.floor((y - top) / 14); px(lx - w / 2, y, w, 1, Math.floor((y - top) / 5) % 2 ? '#e8e4dc' : '#c24a3a'); }
		px(lx - 6, top - 2, 12, 2, '#2a2a30'); px(lx - 4, top - 8, 8, 6, '#2a2a30');
		const glow = 0.25 + 0.75 * p;
		px(lx - 3, top - 7, 6, 4, `rgba(255,214,110,${glow})`);
		px(lx - 4, top - 11, 8, 3, '#c24a3a');
		// the beam sweeps, and reaches further the more has loaded
		const ang = Math.sin(t * 0.9), len = 20 + 120 * p, dir = ang >= 0 ? 1 : -1;
		const a = Math.abs(ang) * 0.35 * glow;
		cx.fillStyle = `rgba(255,236,170,${a})`;
		cx.beginPath(); cx.moveTo(lx, top - 5); cx.lineTo(lx + dir * len, top - 5 - 6 * p); cx.lineTo(lx + dir * len, top - 5 + 10 + 6 * p); cx.closePath(); cx.fill();
		// a little ship that comes in as the bar fills
		const sx = 192 - 110 * p;
		px(sx, 60, 10, 2, '#2a2230'); px(sx + 4, 52, 1, 8, '#2a2230'); px(sx + 5, 53, 4, 4, '#d9d4c4');
		requestAnimationFrame(draw);
	}
	draw();

	// ---- start
	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail(T.missing + ' ' + missing.join(', '));
		return;
	}
	engine.startGame({ onProgress: onProgress }).then(finish, fail);
}());
</script>
</body>
</html>
